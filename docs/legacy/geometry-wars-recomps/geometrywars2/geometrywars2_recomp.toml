# Geometry Wars: Retro Evolved 2 - XenonRecomp configuration.
#
# The function boundaries and the ABI helper addresses below are not hand
# written and were not found by XenonAnalyse: they come from ReXGlue's codegen,
# which discovers them and then refuses to emit a single line of code while any
# branch target is unresolved. XenonRecomp's own README gives up on both - jump
# tables ("there is currently no solution for this") and the register save and
# restore functions ("no mechanism for it") - so this is the join between the
# two toolchains: ReXGlue converts, XenonRecomp builds the native code.
[main]
file_path = "assets/default.xex"
out_directory_path = "ppc"
switch_table_file_path = "geometrywars2_jumptable.toml"

# Left off until there is a running recompilation, as the README advises.
skip_lr = false
skip_msr = false
ctr_as_local = false
xer_as_local = false
reserved_as_local = false
cr_as_local = false
non_argument_as_local = false
non_volatile_as_local = false

longjmp_address = 0x82131890
setjmp_address = 0x82131CD0



restgprlr_14_address = 0x8212E950
savegprlr_14_address = 0x8212E900
restfpr_14_address = 0x8212E8AC
savefpr_14_address = 0x8212E860
restvmx_14_address = 0x82133388
savevmx_14_address = 0x821330F0
restvmx_64_address = 0x8213341C
