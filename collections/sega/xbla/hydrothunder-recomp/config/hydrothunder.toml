# Per-title run configuration for a new port: the settings every conversion so
# far has ended up wanting, with the measurement that justifies each one. The
# scaffold (tools/new_port.sh) copies this into config/<title>.toml, which the
# runtime loads from next to the executable.
#
# Order to turn things off if a title misbehaves: gpu_hot_page_frames first,
# then clear_memory_page_state, then render_target_path_vulkan.

# BRING-UP ONLY. Log an indirect-call target that was never recompiled and
# return 0 rather than aborting, so the first run surfaces the whole
# missing-function frontier instead of one abort per run. Revisit before
# calling a port finished.
unregistered_function_nonfatal = true

# Engines routinely issue resolves and fetches the strict path rejects.
gpu_allow_invalid_fetch_constants = true

# Async pipeline compilation skips presents and draws untextured placeholders on
# every title tried so far. Compile synchronously and answer the hitches with a
# warm cache instead: play through the content, then point
# shader_storage_seed_root at a directory of the resulting shareable cache files
# so a fresh install starts with its pipelines already built.
# ON for this title, against the profile default. Hydro compiles pipelines
# throughout gameplay - 208 in one session, still arriving 9 a second well into
# a race - and compiling them synchronously stalls a frame each time, which is
# the "buffering" you feel. Verified here: renders correctly with async on,
# 1 skipped present in 30 s. The warning in the profile about async skipping
# presents does not hold for this title.
# Back OFF. It was turned on to hide compile stalls, but the profile's warning
# is right for this title too: async draws untextured placeholders and skips
# presents, which reads as flashing. With the driver pipeline cache warm - 17 MB
# on disk, 12.8 MB loaded at startup - the pipelines this title creates are
# cache hits rather than compiles, so the stalls it was hiding are largely gone.
async_shader_compilation = false

# The host render-target path, not the fragment-shader-interlock EDRAM path.
# FSI serialises fragment shading: on Midnight Club LA, once the CPU side was
# fixed, that was 25% of the frame (66 ms -> 49 ms, same scene). Split/Second
# and Ridge Racer Unbounded need FSI for their colour grade - check a matched
# pair of frames from one spot on both paths before believing either.
# Red flooding. Three stacked causes were found for exactly this on Ridge Racer
# Unbounded and are documented in the rru-red-flood-fix notes; all three apply
# to any title with sun flare, a colour-grade LUT and auto-exposure.
#
# 3. auto-exposure misbehaves on the host render-target path; the
#    fragment-shader-interlock EDRAM path is the one upstream notes say fixes it.
render_target_path_vulkan = "host"

# PCSX-style enhancement baseline: render at 2x the guest internal resolution,
# keep native 2x MSAA, and sharpen oblique surfaces with 16x anisotropic filtering.
# These affect the native Vulkan renderer, not the guest's game logic.
resolution_scale = 1
native_2x_msaa = true
anisotropic_override = 3

# 1. flare intensity is driven from occlusion queries, and the fake sample count
#    defaults to "fully visible" every frame, which gives a screen-filling
#    starburst. 0, not -1: -1 makes the title resolve uncommitted memory and
#    SIGBUS. Disabling occlusion queries does not help - the fallback writes the
#    same fake value.
query_occlusion_fake_sample_count = 0

# Not applied here: gpu_3d_to_2d_texture=false and the fsi render path. Both are
# part of the same documented red-flood fix, but applying all three at once hung
# this title on its loading screen. One at a time.

# Do not wipe shared-memory page-valid state at every frame end. With it on (the
# SDK default) every page the CPU uploaded loses its valid bit each frame, so
# the whole CPU-visible working set is re-uploaded next frame - measured at
# ~190 MB per two seconds for ~1 MB of actual guest writes. Worth 2.9 -> 10 FPS
# on Midnight Club LA. Turn it back on if geometry renders stale.
# TRUE, the runtime default. This refreshes page-valid state from GPU-written
# memory at frame end, and the SDK's own note on disabling it is "may break
# memory coherency" - which is precisely the corruption seen here: blocky
# tile-pattern garbage over sky and water, i.e. reading pages whose contents the
# GPU changed without us noticing. The CPU it saves is not worth it.
clear_memory_page_state = true

# Treat a 256 KB block of shared memory dirtied this many frames running as
# permanently dirty: stop arming its guest write watch and re-upload it once per
# frame, as one batch when the frame opens. Streaming titles rewrite a handful
# of geometry pools every frame, and for those the watch only buys a guest trap
# and another arming, both of which take the kernel-wide lock. Worth 12 -> 20
# FPS, and batching the uploads took render passes from 701 to 106 a frame.
#
# The trade: draws late in a frame do not see writes the guest made after that
# frame's first upload of a hot page. This is the first thing to turn off if
# geometry flickers or lags a frame.
# 0, not 3. The "red flashing" turned out to be texture corruption - blocky
# orange/magenta over the sky and striped green over the water, in the Xenos
# tile pattern - which is what reading a page that was never re-uploaded looks
# like. Hot-page caching skips re-uploading pages it believes are unchanged, and
# this is the first lever the profile says to turn off when a title misbehaves.
gpu_hot_page_frames = 0

# Answer the guest's on-screen keyboard from configuration instead of showing a
# dialog. Titles use that keyboard for profile and gamertag names, and typing
# into an ImGui popup while the game owns the keyboard is awkward. Set it to the
# name the profile should have; empty (the default) shows the dialog.
# keyboard_text = "PLAYER"

# Answer system prompts with their default instead of drawing ReXGlue's own
# (green) ImGui dialog over the game. One local profile, one device: no choice.
headless = false

# The window's name. Without it the title bar reads "<slug> rexglue <build>",
# which is right while bringing a port up and wrong in anything shipped.
window_title = "Hydro Thunder Hurricane"
side_panel_title = "Hydro Thunder Hurricane"
window_width = 1280
window_height = 720
fullscreen = true
# Launcher-selectable presentation cap. The launcher defaults this to 60 and
# rewrites it when Settings are saved.
vsync = true
vsync_fps_cap = 60
