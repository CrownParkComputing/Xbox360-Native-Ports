# Non-volatile PowerPC registers in C++ locals: elides the save/restore helper
# calls in every prologue and epilogue (9% of samples on SoulCalibur II) and
# lets the compiler keep them in host registers. Hydro is the title most likely
# to feel it - it is the one that runs slowest on the device.
