# Dispatches reviewed and found NOT to be switch tables.
#
# XenonRecomp reports "Found a switch jump table at X with no switch table
# entry present" for any `bctr` it cannot turn into a switch, and the
# convergence gate refuses to pass while any are outstanding - because the
# usual cause is a table nobody recovered, and the binary then links,
# boots, and jumps into an empty function-table slot on exactly one case.


# ---- rexglue-harvested dispatches ----
# Each entry below is a bctr rexglue-sdk emitted that is NOT in
# sonic4_ep2_jumptable.toml - rexglue codegen resolved it as a real
# indirect dispatch (a vtable call or a function-pointer load), not as a
# switch table. Leaving them as plain indirect calls in the recompiled
# output is correct, which is why the recomp gate would otherwise refuse
# to converge on them.

