# Initial XenonAnalyse jump-table inventory for Jetpac Refuelled.
# The converge pass appends only tables validated against image.bin: a
# dispatch XenonRecomp did not already emit as a switch, whose table contents
# read as addresses inside the enclosing function.
#
# When the emitted and recovered readings of one table disagree on the register
# alone, the register that belongs here is the one the SCALING instruction READ,
# not the one the bounds check tested - the bounds register may be clobbered
# before the bctr, and XenonRecomp's model is `switch (ctx.rN.u32)` with cases
# numbered from zero, so rN must still hold the raw index at the branch.
# ---- ABSOLUTE JUMPTABLE ----
# ---- COMPUTED JUMPTABLE ----
# ---- OFFSETED JUMPTABLE ----


