# Non-volatile PowerPC registers live in C++ locals rather than the guest
# context. Elides the __savegprlr_N/__restgprlr_N calls in every prologue and
# epilogue - 9% of all samples on SoulCalibur II - and lets the compiler keep
# those registers in host registers instead of reloading them from memory.
non_volatile_as_local = true

# The four sibling *_as_local flags each kill a different save/restore pair
# (__setflm / __savegprlr_*_cr for CR, __mtctr for CTR, XER pairs, and the
# r0+r3..r12 arg-reg save). Combined with non_volatile_as_local above this
# collapses the prologue from ~70 instructions of register shuffling down to
# the handful the function actually uses - the recomp_perf note calls these
# "sibling options nothing uses yet, same family, worth trying next".
#cr_as_local = true
#ctr_as_local = true
#xer_as_local = true
#non_argument_as_local = true
#reserved_as_local = true

# Found by tools/find_setjmp.py. Codegen recovers the save/restore helpers and
# the switch tables itself but not these, and undeclared, the longjmp is emitted
# as an ORDINARY CALL - control never unwinds and the caller continues with
# non-volatile registers restored from a stale jmp_buf. The damage surfaces far
# from the cause: an unrelated function calling a pointer it never computed, or
# computing a wrong value from a register it never set.
longjmp_address = 0x8241F9D0
setjmp_address = 0x8241FCF0
