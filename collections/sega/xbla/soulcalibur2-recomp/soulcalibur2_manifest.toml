# Keep the PowerPC non-volatile registers in C++ locals instead of the guest
# context. Two effects: the __savegprlr_N/__restgprlr_N helper calls in every
# prologue and epilogue are elided (measured at 9% of all samples on this
# title), and the compiler can then hold those registers in host registers
# instead of reloading them from memory.
non_volatile_as_local = true

# Found by tools/find_setjmp.py. Codegen recovers the save/restore helpers and
# the switch tables itself but not these, and undeclared, the longjmp is emitted
# as an ORDINARY CALL - control never unwinds and the caller continues with
# non-volatile registers restored from a stale jmp_buf. The damage surfaces far
# from the cause: an unrelated function calling a pointer it never computed, or
# computing a wrong value from a register it never set.
longjmp_address = 0x8247C9B0
setjmp_address = 0x8247CDF0
